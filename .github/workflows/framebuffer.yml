name: framebuffer

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/framebuffer.yml'
      - 'framebuffer/**'
      - 'pixel/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/framebuffer.yml'
      - 'framebuffer/**'
      - 'pixel/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  linux-kms:
    name: framebuffer (Linux VKMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test KMS with VKMS
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          prepare: |
            apt-get update
            apt-get install -y curl linux-modules-extra-$(uname -r)
            curl -fsSLO https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
            tar -C /usr/local -xzf go1.23.4.linux-amd64.tar.gz
          run: |
            export PATH=/usr/local/go/bin:$PATH
            export CGO_ENABLED=0
            modprobe vkms
            udevadm settle
            kms_device=
            for device in /dev/dri/card*; do
              [ -e "$device" ] || continue
              sysfs_path=$(readlink -f "/sys/class/drm/${device##*/}")
              if echo "$sysfs_path" | grep -q '/platform/vkms/drm/'; then
                kms_device=$device
                break
              fi
            done
            if [ -z "$kms_device" ]; then
              echo 'Failed to find the VKMS device node.'
              ls -l /dev/dri 2>/dev/null || true
              for card in /sys/class/drm/card*; do
                [ -e "$card" ] && { echo "$card"; udevadm info --query=property --path="$card" || true; }
              done
              exit 1
            fi
            export DISPLAY_TEST_REQUIRE_HARDWARE=1
            export DISPLAY_TEST_KMS_DEVICE=$kms_device
            go test -v ./framebuffer/kms/...
            go test -v -run '^TestHardwareKMS$' ./framebuffer

  linux-fbdev:
    name: framebuffer (Linux vfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test fbdev with vfb
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          prepare: |
            apt-get update
            apt-get install -y build-essential curl linux-headers-$(uname -r) linux-modules-extra-$(uname -r) linux-source
            curl -fsSLO https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
            tar -C /usr/local -xzf go1.23.4.linux-amd64.tar.gz
          run: |
            export PATH=/usr/local/go/bin:$PATH
            export CGO_ENABLED=0
            kernel_release=$(uname -r)
            source_archive=$(find /usr/src -maxdepth 1 -name 'linux-source-*.tar.bz2' -print -quit)
            if [ -z "$source_archive" ]; then
              echo 'Failed to find the Linux kernel source archive.'
              exit 1
            fi
            mkdir -p /tmp/linux-source
            tar -xjf "$source_archive" -C /tmp/linux-source --strip-components=1
            make -C "/lib/modules/$kernel_release/build" \
              M=/tmp/linux-source/drivers/video/fbdev \
              CONFIG_FB_VIRTUAL=m modules
            insmod /tmp/linux-source/drivers/video/fbdev/vfb.ko \
              vfb_enable=1 mode_option=640x480-16@60
            udevadm settle
            fbdev_device=
            for device in /dev/fb*; do
              [ -e "$device" ] || continue
              name=$(cat "/sys/class/graphics/${device##*/}/name" 2>/dev/null || true)
              if [ "$name" = 'Virtual FB' ]; then
                fbdev_device=$device
                break
              fi
            done
            if [ -z "$fbdev_device" ]; then
              echo 'Failed to find the vfb device node.'
              ls -l /dev/fb* 2>/dev/null || true
              exit 1
            fi
            export DISPLAY_TEST_REQUIRE_HARDWARE=1
            export DISPLAY_TEST_FBDEV_DEVICE=$fbdev_device
            go test -v ./framebuffer/fbdev/...
            go test -v -run '^TestHardwareFBDev$' ./framebuffer

  freebsd:
    name: framebuffer (FreeBSD 15.1 amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test framebuffer packages on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: x86_64
          prepare: pkg install -y go
          run: CGO_ENABLED=0 go test -v ./framebuffer/...
