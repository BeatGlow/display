name: framebuffer

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/framebuffer.yml'
      - 'framebuffer/**'
      - 'pixel/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/framebuffer.yml'
      - 'framebuffer/**'
      - 'pixel/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  framebuffer:
    name: framebuffer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test framebuffer packages
        run: go test -v ./framebuffer/...

  freebsd:
    name: framebuffer (FreeBSD 15.1 amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test framebuffer packages on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: x86_64
          prepare: pkg install -y go
          run: CGO_ENABLED=0 go test -v ./framebuffer/...
