name: framebuffer

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/framebuffer.yml'
      - 'framebuffer/**'
      - 'pixel/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/framebuffer.yml'
      - 'framebuffer/**'
      - 'pixel/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  framebuffer:
    name: framebuffer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test framebuffer packages
        run: go test ./framebuffer/...

  freebsd:
    name: framebuffer (FreeBSD amd64 compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cross-compile FreeBSD framebuffer tests
        env:
          CGO_ENABLED: 0
          GOOS: freebsd
          GOARCH: amd64
        run: go test -exec /usr/bin/true ./framebuffer/...
