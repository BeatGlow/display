name: offline display

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  select-drivers:
    runs-on: ubuntu-latest
    outputs:
      drivers: ${{ steps.select.outputs.drivers }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Select driver checks from changed paths
        id: select
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          all_drivers=0
          drivers=()
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            all_drivers=1
          else
            while IFS= read -r path; do
              case "$path" in
                gu3000.go) drivers+=(gu3000) ;;
                gu256x64d7000.go) drivers+=(gu256x64d7000) ;;
                gp1287.go) drivers+=(gp1278) ;;
                gp1294.go) drivers+=(gp1294) ;;
                sh1106.go) drivers+=(sh1106) ;;
                ssd1305.go) drivers+=(ssd1305) ;;
                ssd1306.go) drivers+=(ssd1306) ;;
                ssd1322.go) drivers+=(ssd1322) ;;
                sh1122.go) drivers+=(sh1122) ;;
                st7735.go) drivers+=(st7735) ;;
                st7789.go) drivers+=(st7789) ;;
                *) all_drivers=1 ;;
              esac
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi

          if [[ "$all_drivers" == "1" || ${#drivers[@]} == 0 ]]; then
            drivers=(gu3000 gu256x64d7000 gp1278 gp1294 sh1106 ssd1305 ssd1306 ssd1322 sh1122 st7735 st7789)
          fi

          drivers_json='['
          for driver in "${drivers[@]}"; do
            drivers_json+="\"$driver\","
          done
          drivers_json="${drivers_json%,}]"
          printf 'drivers=%s\n' "$drivers_json" >> "$GITHUB_OUTPUT"
          printf 'Selected offline drivers: %s\n' "${drivers[*]}"

  offline-virtual:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        color: [mono, gray2, gray4, rgb15, rgb16]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run virtual framebuffer color check
        env:
          COLOR: ${{ matrix.color }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/display-artifacts"
          go run ./cmd/display-test \
            -width 37 -height 19 -color "$COLOR" \
            -output "$RUNNER_TEMP/display-artifacts/virtual-$COLOR.png" \
            -trace "$RUNNER_TEMP/display-artifacts/virtual-$COLOR.json" \
            offline virtual

      - name: Upload virtual framebuffer preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/display-artifacts/virtual-${{ matrix.color }}.png
          archive: false
          if-no-files-found: error

      - name: Upload virtual display traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-display-virtual-${{ matrix.color }}-trace
          path: ${{ runner.temp }}/display-artifacts/virtual-${{ matrix.color }}.json
          if-no-files-found: error

  offline-driver:
    needs: select-drivers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.select-drivers.outputs.drivers) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run driver emulation
        env:
          DRIVER: ${{ matrix.driver }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/display-artifacts"
          go run ./cmd/display-test \
            -contrast 128 \
            -output "$RUNNER_TEMP/display-artifacts/$DRIVER.png" \
            -trace "$RUNNER_TEMP/display-artifacts/$DRIVER.json" \
            offline "$DRIVER"

      - name: Upload browser-viewable driver preview
        id: preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/display-artifacts/${{ matrix.driver }}.png
          archive: false
          if-no-files-found: error

      - name: Upload driver trace
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-display-${{ matrix.driver }}-trace
          path: ${{ runner.temp }}/display-artifacts/${{ matrix.driver }}.json
          if-no-files-found: error

      - name: Link preview in job summary
        if: always() && steps.preview.outputs.artifact-url != ''
        env:
          DRIVER: ${{ matrix.driver }}
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          printf '### %s preview\n\n[Open PNG preview in your browser](%s)\n' "$DRIVER" "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  offline-gallery:
    needs: [select-drivers, offline-virtual, offline-driver]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all tested screen previews
        uses: actions/download-artifact@v8
        with:
          pattern: '*.png'
          path: ${{ runner.temp }}/display-previews
          merge-multiple: true

      - name: Create browser-viewable gallery
        env:
          EXPECTED_DRIVERS: ${{ needs.select-drivers.outputs.drivers }}
          PREVIEW_DIR: ${{ runner.temp }}/display-previews
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64encode
          from html import escape
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["PREVIEW_DIR"])
          images = {image.name: image for image in directory.glob("*.png")}
          expected = [
              "virtual-mono.png", "virtual-gray2.png", "virtual-gray4.png",
              "virtual-rgb15.png", "virtual-rgb16.png",
          ] + [f"{driver}.png" for driver in json.loads(os.environ["EXPECTED_DRIVERS"])]

          cards = []
          for name in expected:
              image = images.get(name)
              if image is None:
                  content = '<p class="missing">Preview unavailable; the test did not produce an image.</p>'
              else:
                  encoded = b64encode(image.read_bytes()).decode("ascii")
                  content = f'<img src="data:image/png;base64,{encoded}" alt="{escape(image.stem)}">'
              cards.append(f'<section><h2>{escape(Path(name).stem)}</h2>{content}</section>')

          page = """<!doctype html>
          <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>Offline display previews</title>
          <style>body{font:16px system-ui;margin:2rem;background:#181818;color:#eee}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}section{padding:1rem;background:#282828;border-radius:.5rem}img{display:block;width:100%;max-width:760px;height:auto;image-rendering:pixelated;background:#000}.missing{padding:1rem;background:#481f1f}</style>
          <h1>Offline display previews</h1><main>
          """ + "\n".join(cards) + "\n</main></html>"
          (directory / "display-gallery.html").write_text(page, encoding="utf-8")
          PY

      - name: Upload browser-viewable gallery
        id: gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/display-previews/display-gallery.html
          archive: false
          if-no-files-found: error

      - name: Link gallery in job summary
        if: always() && steps.gallery.outputs.artifact-url != ''
        env:
          GALLERY_URL: ${{ steps.gallery.outputs.artifact-url }}
        run: |
          printf '### Tested display gallery\n\n[Open all tested screen previews](%s)\n' "$GALLERY_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview overview on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          EXPECTED_DRIVERS: ${{ needs.select-drivers.outputs.drivers }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- offline-display-preview-gallery -->';
            const drivers = JSON.parse(process.env.EXPECTED_DRIVERS);
            const expected = [
              'virtual-mono.png', 'virtual-gray2.png', 'virtual-gray4.png',
              'virtual-rgb15.png', 'virtual-rgb16.png',
              ...drivers.map(driver => `${driver}.png`),
            ];
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId, per_page: 100 },
            );
            const artifactsByName = new Map(artifacts.map(artifact => [artifact.name, artifact]));
            const artifactURL = artifact =>
              `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            const gallery = artifactsByName.get('display-gallery.html');
            const rows = expected.map(name => {
              const artifact = artifactsByName.get(name);
              const preview = artifact
                ? `[Open preview](${artifactURL(artifact)})`
                : 'No preview artifact';
              return `| ${name.replace(/\.png$/, '')} | ${preview} |`;
            });
            const body = [
              marker,
              '## Offline display preview overview',
              '',
              gallery
                ? `[Open the full gallery for this run](${artifactURL(gallery)})`
                : 'The full gallery artifact was not produced; individual previews are listed below.',
              '',
              `Previews expected in this run: **${expected.length}** (5 virtual color modes and ${drivers.length} selected drivers).`,
              '',
              '| Screen | PNG preview |',
              '| --- | --- |',
              ...rows,
              '',
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. Offline test results are reported in the checks above.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.filter(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            for (const comment of previous) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: comment.id,
              });
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
