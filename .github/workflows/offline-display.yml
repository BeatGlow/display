name: offline display

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  select-drivers:
    runs-on: ubuntu-latest
    outputs:
      drivers: ${{ steps.select.outputs.drivers }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Select driver checks from changed paths
        id: select
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          all_drivers=0
          drivers=()
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            all_drivers=1
          else
            while IFS= read -r path; do
              case "$path" in
                gu3000.go) drivers+=(gu3000) ;;
                gu256x64d7000.go) drivers+=(gu256x64d7000) ;;
                gp1287.go) drivers+=(gp1278) ;;
                gp1294.go) drivers+=(gp1294) ;;
                sh1106.go) drivers+=(sh1106) ;;
                ssd1305.go) drivers+=(ssd1305) ;;
                ssd1306.go) drivers+=(ssd1306) ;;
                ssd1322.go) drivers+=(ssd1322) ;;
                sh1122.go) drivers+=(sh1122) ;;
                st7735.go) drivers+=(st7735) ;;
                st7789.go) drivers+=(st7789) ;;
                *) all_drivers=1 ;;
              esac
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi

          if [[ "$all_drivers" == "1" || ${#drivers[@]} == 0 ]]; then
            drivers=(gu3000 gu256x64d7000 gp1278 gp1294 sh1106 ssd1305 ssd1306 ssd1322 sh1122 st7735 st7789)
          fi

          drivers_json='['
          for driver in "${drivers[@]}"; do
            drivers_json+="\"$driver\","
          done
          drivers_json="${drivers_json%,}]"
          printf 'drivers=%s\n' "$drivers_json" >> "$GITHUB_OUTPUT"
          printf 'Selected offline drivers: %s\n' "${drivers[*]}"

  offline-virtual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run virtual framebuffer color checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/display-artifacts"
          for model in mono gray2 gray4 rgb15 rgb16; do
            go run ./cmd/display-test \
              -width 37 -height 19 -color "$model" \
              -output "$RUNNER_TEMP/display-artifacts/virtual-$model.png" \
              -trace "$RUNNER_TEMP/display-artifacts/virtual-$model.json" \
              offline virtual
          done

      - name: Create browser-viewable color preview gallery
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64encode
          from html import escape
          from pathlib import Path

          directory = Path("${{ runner.temp }}/display-artifacts")
          images = sorted(directory.glob("virtual-*.png"))
          if len(images) != 5:
              raise SystemExit(f"expected 5 preview PNGs, found {len(images)}")

          cards = []
          for image in images:
              encoded = b64encode(image.read_bytes()).decode("ascii")
              cards.append(
                  f'<section><h2>{escape(image.stem.removeprefix("virtual-"))}</h2>'
                  f'<img src="data:image/png;base64,{encoded}" alt="{escape(image.stem)}"></section>'
              )

          page = """<!doctype html>
          <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>Offline virtual display previews</title>
          <style>body{font:16px system-ui;margin:2rem;background:#181818;color:#eee}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}section{padding:1rem;background:#282828;border-radius:.5rem}img{display:block;width:100%;max-width:760px;height:auto;image-rendering:pixelated;background:#000}</style>
          <h1>Offline virtual display previews</h1><main>
          """ + "\n".join(cards) + "\n</main></html>"
          (directory / "virtual-gallery.html").write_text(page, encoding="utf-8")
          PY

      - name: Upload browser-viewable color preview gallery
        id: preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/display-artifacts/virtual-gallery.html
          archive: false
          if-no-files-found: error

      - name: Upload virtual display traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-display-virtual-traces
          path: ${{ runner.temp }}/display-artifacts/virtual-*.json
          if-no-files-found: error

      - name: Link preview gallery in job summary
        if: always() && steps.preview.outputs.artifact-url != ''
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          printf '### Virtual display previews\n\n[Open the preview gallery in your browser](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  offline-driver:
    needs: select-drivers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.select-drivers.outputs.drivers) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run driver emulation
        env:
          DRIVER: ${{ matrix.driver }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/display-artifacts"
          go run ./cmd/display-test \
            -contrast 128 \
            -output "$RUNNER_TEMP/display-artifacts/$DRIVER.png" \
            -trace "$RUNNER_TEMP/display-artifacts/$DRIVER.json" \
            offline "$DRIVER"

      - name: Upload browser-viewable driver preview
        id: preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/display-artifacts/${{ matrix.driver }}.png
          archive: false
          if-no-files-found: error

      - name: Upload driver trace
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-display-${{ matrix.driver }}-trace
          path: ${{ runner.temp }}/display-artifacts/${{ matrix.driver }}.json
          if-no-files-found: error

      - name: Link preview in job summary
        if: always() && steps.preview.outputs.artifact-url != ''
        env:
          DRIVER: ${{ matrix.driver }}
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          printf '### %s preview\n\n[Open PNG preview in your browser](%s)\n' "$DRIVER" "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
