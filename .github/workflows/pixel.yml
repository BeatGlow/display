name: pixel

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/pixel.yml'
      - 'pixel/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/pixel.yml'
      - 'pixel/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  pixel:
    name: pixel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test pixel package
        run: go test ./pixel/...
